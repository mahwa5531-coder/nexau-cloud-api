# MASh Cloud API — local/production-shaped stack.
#
#   docker compose up -d          # postgres + redis + api
#   docker compose logs -f api
#   docker compose down -v        # full reset
#
# Secrets come from the environment (.env next to this file is read by
# compose automatically): NEXAU_AUTH_HS256_SECRET and OPENROUTER_API_KEY
# are REQUIRED for the api service to start (see the api.environment block).
#
# The LLM upstream is OpenRouter, called directly over HTTPS: no gateway
# container. Provider keys are registered in the OpenRouter account (BYOK,
# "never shared capacity"); this deployment only holds the OpenRouter API key.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mash
      POSTGRES_PASSWORD: mash-dev-only
      POSTGRES_DB: mash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mash -d mash"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEXAU_HTTP_ADDR: ":8080"
      NEXAU_DATABASE_URL: "postgres://mash:mash-dev-only@postgres:5432/mash?sslmode=disable"
      NEXAU_REDIS_URL: "redis://redis:6379/0"
      NEXAU_OPENROUTER_URL: "${NEXAU_OPENROUTER_URL:-https://openrouter.ai/api}"
      NEXAU_OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is not set: create one at https://openrouter.ai/keys}"
      NEXAU_AUTH_MODE: "local"
      # SECURITY (2026-09-19 audit, finding 1): the JWT signing secret is a
      # deployment credential and is NEVER committed. Compose fails fast with
      # this message when it is missing. Generate one:
      #   echo "NEXAU_AUTH_HS256_SECRET=$(openssl rand -hex 32)" >> .env
      # Any deployment that ever ran with the previously committed default
      # MUST rotate (all access tokens are invalidated by rotation).
      NEXAU_AUTH_HS256_SECRET: "${NEXAU_AUTH_HS256_SECRET:?NEXAU_AUTH_HS256_SECRET is not set: generate one with: openssl rand -hex 32}"
      NEXAU_LOG_LEVEL: "info"
      NEXAU_LOG_FORMAT: "json"
      NEXAU_OTEL_PROMETHEUS: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
